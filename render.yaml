services:
  # 1. Backend Service (Node.js + Express API)
  - type: web
    name: medmitra-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard (e.g. mongodb+srv://...)
      - key: FRONTEND_URL
        fromService:
          type: web
          name: medmitra-frontend
          property: url
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: medmitra-ai-service
          property: url
      - key: REDIS_URL
        fromService:
          type: redis
          name: medmitra-redis
          property: connectionString

  # 2. AI Service (Python + FastAPI)
  - type: web
    name: medmitra-ai-service
    env: python
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 3. Frontend Web App (React + Vite Static Site)
  - type: web
    name: medmitra-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medmitra-backend
          property: url
          append: /api/v1

  # 4. Redis Key-Value Store (For BullMQ Job Queue)
  - type: redis
    name: medmitra-redis
    plan: free
    ipAllowList: []
